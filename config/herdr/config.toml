onboarding = false

[theme]
name = "terminal"
auto_switch = false

[keys]
# ^A, out of tmux muscle memory. This shadows the shell's beginning-of-line,
# but ^A^A sends a literal ^A through, the way tmux's send-prefix does.
prefix = "ctrl+a"

# Open the current directory in Zed. A shell command runs detached, from the
# focused pane's working directory, which is what a GUI editor wants.
[[keys.command]]
key = "prefix+e"
type = "shell"
command = "zed ."
description = "open in zed"

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = false
status_indicators = "symbols"

[ui.toast]
delivery = "off"
