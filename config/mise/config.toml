[tools]

node = "latest"
ruby = "latest"
usage = "latest"
yarn = "latest"

# Language servers and formatters for Neovim. They live here rather than in
# Homebrew so they run on mise's Node and Ruby, which means the project's
# version when you're inside one.
"gem:syntax_tree" = "latest"
"npm:@fsouza/prettierd" = "latest"
"npm:bash-language-server" = "latest"
"npm:typescript" = "latest"
"npm:vscode-langservers-extracted" = "latest" # The eslint language server.

[settings]

[settings.ruby]
compile = false
